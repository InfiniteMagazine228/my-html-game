<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Maze Chase 3D - FPS</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #fpsCounter {
      position: absolute; top: 10px; left: 10px;
      color: #0f0; font-family: monospace; font-size: 16px;
      background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;
    }
  </style>
</head>
<body>
<div id="fpsCounter">FPS: 0</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/controls/PointerLockControls.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
let scene, camera, renderer, controls, player, socket, players = {};
let fpsCounter = document.getElementById("fpsCounter");
let lastFrameTime = performance.now();

init();
animate();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Mặt đất
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshBasicMaterial({color: 0x333333})
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  // Tường
  const wallGeo = new THREE.BoxGeometry(2, 4, 10);
  const wallMat = new THREE.MeshBasicMaterial({color: 0x00ff00});
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.set(0, 2, 0);
  scene.add(wall);

  // Player
  const playerGeo = new THREE.BoxGeometry(1,1,1);
  const playerMat = new THREE.MeshBasicMaterial({color: 0xff0000});
  player = new THREE.Mesh(playerGeo, playerMat);
  player.position.set(0,1,5);
  scene.add(player);

  // Controls góc nhìn thứ nhất
  controls = new THREE.PointerLockControls(camera, document.body);
  document.body.addEventListener('click', () => controls.lock());

  // Socket.io kết nối Python backend
  socket = io("https://my-html-game.onrender.com"); // thay bằng URL Flask-SocketIO của bạn
  socket.on("update", (data) => { players = data; });

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function animate() {
  requestAnimationFrame(animate);

  // FPS counter
  let now = performance.now();
  let delta = now - lastFrameTime;
  lastFrameTime = now;
  let fps = Math.round(1000 / delta);
  fpsCounter.textContent = "FPS: " + fps;

  renderer.render(scene, camera);
}
</script>
</body>
</html>
