<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Maze Chase 3D</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #eee; }
    #menu {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.8); z-index: 10;
    }
    #menu h1 { font-size: 48px; margin-bottom: 20px; color: #0f0; }
    #menu button {
      padding: 15px 30px; margin: 10px; font-size: 20px;
      background: #0f0; border: none; cursor: pointer; border-radius: 8px;
    }
    #footer {
      position: absolute; bottom: 10px; width: 100%; text-align: center;
      font-size: 14px; color: #888;
    }
  </style>
</head>
<body>
<div id="menu">
  <h1>Maze Chase 3D</h1>
  <button onclick="startGame()">Bắt đầu chơi</button>
</div>
<div id="footer">© 2026 Hiền - All rights reserved</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
let scene, camera, renderer, player, socket, players = {};

function startGame() {
  document.getElementById("menu").style.display = "none";

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Mặt đất
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshBasicMaterial({color: 0x333333})
  );
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  // Tường mê cung
  const wallGeo = new THREE.BoxGeometry(2, 4, 10);
  const wallMat = new THREE.MeshBasicMaterial({color: 0x00ff00});
  const wall = new THREE.Mesh(wallGeo, wallMat);
  wall.position.set(0, 2, 0);
  scene.add(wall);

  // Player
  const playerGeo = new THREE.BoxGeometry(1,1,1);
  const playerMat = new THREE.MeshBasicMaterial({color: 0xff0000});
  player = new THREE.Mesh(playerGeo, playerMat);
  player.position.set(0,1,5);
  scene.add(player);

  camera.position.set(0,5,15);

  // Socket.io kết nối server
  socket = io("https://your-render-app.onrender.com"); // thay bằng URL Render của bạn
  socket.on("update", (data) => {
    players = data;
  });

  document.addEventListener("keydown", (e) => {
    if(e.key === "w") player.position.z -= 1;
    if(e.key === "s") player.position.z += 1;
    if(e.key === "a") player.position.x -= 1;
    if(e.key === "d") player.position.x += 1;
    socket.emit("move", {x:player.position.x, y:player.position.y, z:player.position.z});
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
</script>
</body>
</html>
